

name: CodeOne Testing Workflow

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-website:
    name: test-website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          test -s index.html
          test -s style.css
          test -s script.js
          echo "All website files are present."

      - name: Check HTML
        run: |
          grep -q "<html" index.html
          grep -q "</html>" index.html
          echo "HTML check passed."

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          echo "JavaScript syntax check passed."

      - name: Check CSS syntax
        run: |
          npx --yes stylelint style.css
          echo "CSS syntax check passed."