
name: CodeOne Testing Workflow

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check website
        run: |
          test -s index.html
          echo "Website test passed!"
